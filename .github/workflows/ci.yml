name: QuickServe CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # required for SARIF upload
  actions: write # required for GHA cache backend

jobs:
  static-analysis:
    name: Lint, Type Check & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Audit Application Dependencies
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Build all workspaces
        run: npm run build

      - name: Unit tests
        run: npm test

  security-scan:
    name: Trivy Filesystem & Image Scan (SARIF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-service with GHA cache
        run: |
          docker buildx build \
            --file services/auth-service/Dockerfile \
            --tag quickserve-auth-service:latest \
            --cache-from type=gha,scope=auth-service \
            --cache-to type=gha,mode=max,scope=auth-service \
            --load \
            .

      - name: Trivy Filesystem Scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Trivy Image Scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: quickserve-auth-service:latest
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-service with GHA cache
        run: |
          docker buildx build \
            --file services/auth-service/Dockerfile \
            --tag quickserve-auth-service:latest \
            --cache-from type=gha,scope=auth-service \
            --cache-to type=gha,mode=max,scope=auth-service \
            --load \
            .

      - name: Build remaining services
        run: docker compose build --parallel

  e2e-integration:
    name: System E2E Integration Tests
    needs: [static-analysis, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Stack
        run: docker compose up -d --build

      - name: Wait for infrastructure
        run: |
          echo "Waiting for healthy containers..."
          timeout 180s bash -c '
            while :; do
              healthy=$(docker compose ps --format "{{.Status}}" | grep -c "(healthy)" || true)
              echo "  healthy: $healthy"
              if [ "$healthy" -ge 4 ]; then break; fi
              sleep 3
            done
          '
          echo "Infrastructure is ready."

      - name: Apply database schemas
        run: |
          for svc in order-service menu-service notification-service; do
            echo "--- $svc ---"
            docker compose exec -T "$svc" sh -c "cd services/$svc && npx prisma migrate deploy" \
              || docker compose exec -T "$svc" sh -c "cd services/$svc && npx prisma db push --accept-data-loss" \
              || true
          done

      - name: Seed menu
        run: |
          docker compose exec -T menu-service \
            sh -c "cd services/menu-service && npm run prisma:seed" \
            || docker compose exec -T menu-service \
            sh -c "cd services/menu-service && npx ts-node prisma/seed.ts"

      - name: Wait for public API
        run: |
          echo "Waiting for http://localhost/api/menu ..."
          timeout 180s bash -c '
            until curl -sf http://localhost/api/menu >/dev/null 2>&1; do
              sleep 3
            done
          '
          echo "API reachable."

      - name: Execute E2E integration test
        run: npx ts-node --compiler-options '{"module":"CommonJS","moduleResolution":"Node"}' scripts/e2e-test.ts

      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down stack
        if: always()
        run: docker compose down -v
