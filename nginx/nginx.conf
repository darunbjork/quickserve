# * WHY: Nginx worker processes should match the number of available CPU cores.
# * 'auto' allows Nginx to scale to the host machine's hardware automatically.
worker_processes auto;

events {
    # * WHY: This dictates how many simultaneous connections a single worker can handle.
    # * 1024 is a safe default for development and moderate production workloads.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # * WHY: Hides the Nginx version number from error pages and the Server HTTP header.
    # * Prevents attackers from scanning for known CVEs on specific Nginx versions.
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;

    # Load all modular server configurations
    include /etc/nginx/conf.d/*.conf;
}