# WHY: We define an upstream block to group our gateway replicas into a single logical destination.
upstream gateway_cluster {
    # WHY: least_conn routes new requests to the gateway with the fewest active connections.
    # Node.js is single-threaded; a standard round-robin might blindly send a request to a gateway 
    # that is currently blocked on a CPU-heavy task. least_conn avoids this bottleneck.
    least_conn;

    # WHY: max_fails and fail_timeout provide passive health-checking. 
    # If gateway-1 crashes, Nginx will attempt to route to it, fail 3 times, and then mark it as 
    # "down" for 10 seconds. All traffic will automatically flow to gateway-2 during that window.
    server quickserve-gateway-1:3000 max_fails=3 fail_timeout=10s;
    server quickserve-gateway-2:3000 max_fails=3 fail_timeout=10s;
}

server {
    # Nginx acts as the single public entry point on standard HTTP port 80
    listen 80;
    server_name localhost;

    # WHY: Absorb slow clients at the C-level infrastructure layer.
    # Node.js is highly vulnerable to Slowloris attacks where clients send HTTP headers extremely slowly.
    # proxy_buffering forces Nginx to read the entire request into memory before bothering the Node application.
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    location / {
        proxy_pass http://gateway_cluster;
        
        # WHY: Pass original client information downstream. 
        # Without this, the Express gateway would log Nginx's internal Docker IP for every request.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}